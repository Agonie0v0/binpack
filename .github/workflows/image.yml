name: Test and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Authentication and browser logic tests
        run: |
          python -m unittest -v test_auth.py
          node design/verify-preview.mjs
          node design/verify-auth-client.mjs
      - name: Build and test container runtime
        run: |
          docker build -t binpack:ci .
          docker run --rm --entrypoint python \
            -v "$PWD/test_auth.py:/opt/image-packager/test_auth.py:ro" \
            binpack:ci -m unittest -v test_auth.py
          docker run -d --name binpack-smoke -p 127.0.0.1:8088:8088 binpack:ci
          trap 'docker rm -fv binpack-smoke >/dev/null' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8088/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/builds)" = 401
          docker exec binpack-smoke python -c "from pathlib import Path; p=Path('/data/setup-token'); assert p.is_file(); assert p.stat().st_mode & 0o777 == 0o600"

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=preview,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=binpack
            org.opencontainers.image.description=NAS binary packaging workbench preview. Authentication implemented; packaging and Docker import are UI demos.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo '### Container published' >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'Platforms: linux/amd64, linux/arm64. Packaging remains a UI preview.' >> "$GITHUB_STEP_SUMMARY"
