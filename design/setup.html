<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>设置管理员 · 镜像打包</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/auth.css"><script src="/auth-client.js" defer></script><script src="/auth.js" defer></script></head>
<body class="auth-page" data-auth-page="setup">
<svg class="icon-definitions" aria-hidden="true"><defs><symbol id="a-box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5Z"/><path d="m3 8 9 5 9-5m-9 5v9M7.5 5.5l9 5v4"/></symbol><symbol id="a-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="a-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol></defs></svg>
<header class="auth-header"><a class="brand" href="/login"><span class="brand-mark"><svg class="icon"><use href="#a-box"/></svg></span>镜像打包</a><span>NAS 本地工作台</span></header>
<main class="auth-main"><section class="auth-card setup-card" aria-labelledby="auth-title"><h1 id="auth-title">先设置一个账号。</h1><p class="auth-description">创建管理员，开启你的镜像工作台。</p>
<form id="auth-form"><label for="setup-token">初始化凭证<input id="setup-token" name="setup_token" placeholder="粘贴容器日志中的一次性凭证" autocomplete="off" maxlength="128" spellcheck="false" required></label><p class="input-help">在飞牛 Docker 的容器启动日志中查看。</p>
<label for="username">管理员账号<input id="username" name="username" placeholder="设置登录账号" autocomplete="username" minlength="3" maxlength="32" pattern="[a-zA-Z0-9][a-zA-Z0-9_.\-]{2,31}" autocapitalize="none" spellcheck="false" aria-describedby="username-help" required></label><p class="input-help" id="username-help">3–32 位字母或数字，可包含 . _ -。</p>
<div class="auth-field"><label for="password">密码</label><span class="password-wrap"><input id="password" name="password" type="password" placeholder="至少 12 个字符" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="password-help" required><button class="password-toggle" type="button" data-password-target="password" aria-label="显示密码" aria-pressed="false"><svg class="icon"><use href="#a-eye"/></svg></button></span></div><p class="input-help" id="password-help">可使用长句作为密码，最长 128 个字符。</p>
<div class="auth-field"><label for="confirm-password">确认密码</label><span class="password-wrap"><input id="confirm-password" name="confirm_password" type="password" placeholder="再次输入密码" autocomplete="new-password" minlength="12" maxlength="128" required><button class="password-toggle" type="button" data-password-target="confirm-password" aria-label="显示确认密码" aria-pressed="false"><svg class="icon"><use href="#a-eye"/></svg></button></span></div>
<p id="form-message" class="auth-message" role="alert" aria-live="polite"></p><button class="primary-button auth-submit" id="auth-submit" type="submit" disabled><span>创建账号并进入</span><svg class="icon"><use href="#a-arrow"/></svg></button></form><p class="auth-footnote">仅首次使用需要设置，之后凭账号密码登录。</p>
</section></main><footer class="auth-footer"><span>镜像打包<span class="footer-separator">/</span>通用版</span><a href="/login">返回登录</a></footer>
</body></html>
