<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>账号设置 · 镜像打包</title><link rel="stylesheet" href="/studio.css"><link rel="stylesheet" href="/auth.css"><script src="/auth-client.js" defer></script><script src="/session.js" defer></script><script src="/account.js" defer></script></head>
<body><svg class="icon-definitions" aria-hidden="true"><defs><symbol id="a-box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5Z"/><path d="m3 8 9 5 9-5m-9 5v9M7.5 5.5l9 5v4"/></symbol><symbol id="a-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="a-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol></defs></svg>
<header class="app-header"><div class="header-inner"><a class="brand" href="/"><span class="brand-mark"><svg class="icon"><use href="#a-box"/></svg></span>镜像打包</a><div class="header-end"><button class="text-button" type="button" data-logout>退出登录</button></div></div></header>
<main class="account-main"><div class="account-heading"><a class="account-back" href="/"><svg class="icon"><use href="#a-arrow"/></svg>返回工作台</a><h1>账号设置</h1><p>管理你的登录凭证。</p></div><section class="account-panel" aria-label="管理员账号"><div class="account-identity"><span class="account-avatar" data-account-avatar></span><div><strong data-account-name>正在读取…</strong><p>管理员</p></div></div>
<form id="password-form" class="password-form"><h2>修改密码</h2><p>修改后，所有已登录设备都需要重新登录。</p>
<div class="auth-field"><label for="current-password">当前密码</label><span class="password-wrap"><input id="current-password" name="current_password" type="password" placeholder="输入当前密码" autocomplete="current-password" maxlength="128" required><button class="password-toggle" type="button" data-password-target="current-password" aria-label="显示当前密码" aria-pressed="false"><svg class="icon"><use href="#a-eye"/></svg></button></span></div>
<div class="auth-field"><label for="new-password">新密码</label><span class="password-wrap"><input id="new-password" name="new_password" type="password" placeholder="至少 12 个字符，最长 128 个字符" autocomplete="new-password" minlength="12" maxlength="128" required><button class="password-toggle" type="button" data-password-target="new-password" aria-label="显示新密码" aria-pressed="false"><svg class="icon"><use href="#a-eye"/></svg></button></span></div>
<div class="auth-field"><label for="confirm-password">确认新密码</label><span class="password-wrap"><input id="confirm-password" name="confirm_password" type="password" placeholder="再次输入新密码" autocomplete="new-password" minlength="12" maxlength="128" required><button class="password-toggle" type="button" data-password-target="confirm-password" aria-label="显示确认密码" aria-pressed="false"><svg class="icon"><use href="#a-eye"/></svg></button></span></div>
<p class="auth-message" id="password-message" role="alert"></p><button class="primary-button auth-submit" id="password-submit" type="submit" disabled>保存新密码</button></form></section><footer><span>镜像打包<span class="footer-separator">/</span>账号管理</span><span>通用版</span></footer></main></body></html>
